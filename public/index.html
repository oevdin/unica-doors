<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNICA — продажи и учёт</title>
<meta name="theme-color" content="#10221e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-screen="boot">
<div id="boot" class="boot"><span class="mark">U</span></div>

<section id="login" class="login" hidden>
  <div class="login-art" aria-hidden="true"><span></span><span></span><span></span></div>
  <form class="login-box" onsubmit="doLogin(event)">
    <div class="login-brand"><span class="mark">U</span><b>UNICA</b></div>
    <h1>Вход</h1>
    <label class="field"><span>Логин</span><input id="loginName" type="text" autocomplete="username" autocapitalize="off" required></label>
    <label class="field"><span>Пароль</span><input id="loginPass" type="password" autocomplete="current-password" required></label>
    <p id="loginErr" class="form-err" hidden></p>
    <button id="loginBtn" class="btn primary big block" type="submit">Войти</button>
  </form>
</section>

<div class="shell">
  <aside id="side" class="side"></aside>
  <main id="app" class="main"></main>
</div>
<nav id="tabs" class="tabs" aria-label="Разделы"></nav>
<div id="sheet" hidden></div>
<div id="toast" aria-live="polite"></div>
<div id="print"></div>

<script src="/js/core.js"></script>
<script src="/js/pos.js"></script>
<script src="/js/docs.js"></script>
<script src="/js/cash.js"></script>
<script src="/js/stock.js"></script>
<script src="/js/contacts.js"></script>
<script src="/js/reports.js"></script>
<script src="/js/admin.js"></script>
<script>boot();</script>
</body>
</html>
